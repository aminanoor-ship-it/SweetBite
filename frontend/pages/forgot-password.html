<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Forgot Password | SweetBite</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body class="auth-page">
  <div class="auth-bg" aria-hidden="true"><span class="auth-blob one"></span><span class="auth-blob two"></span><span class="auth-blob three"></span><span class="auth-blob four"></span></div>
  <main class="auth-wrap">
    <section class="auth-card">
      <h1>Forgot Password?</h1>
      <p class="intro">Enter your email address and we'll send you a link to reset your password.</p>
      <form id="forgotForm" class="auth-form" novalidate>
        <div class="form-group">
          <label for="email">Email address:</label>
          <input class="form-control" id="email" name="email" type="email" placeholder="esteban_schiller@gmail.com" required>
        </div>
        <div id="authError" class="auth-error"></div>
        <button class="btn btn-beige auth-submit" type="submit">Send Reset Link</button>
      </form>
      <p class="auth-footer">Remember your password? <a href="login.html">Back to Login</a></p>
    </section>
  </main>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/validation.js"></script>
  <script src="../assets/js/pages/auth.js"></script>
</body>
</html>
