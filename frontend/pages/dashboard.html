<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard | SweetBite</title>
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body data-page="dashboard">
  <div id="sidebar"></div>
  <div class="app-shell">
    <div id="topbar"></div>
    <main class="page-content">
      <div class="page-header"><h1 class="page-title">Dashboard</h1></div>
      <section class="stat-grid" id="dashboardStats"></section>
      <section class="card dashboard-table-card">
        <div class="card-head"><h2>Deals Details</h2><select class="month-select" id="dashboardMonth"></select></div>
        <div class="table-wrap">
          <table class="data-table"><thead><tr><th>Product Name</th><th>Location</th><th>Date - Time</th><th>Piece</th><th>Amount</th><th>Status</th></tr></thead><tbody id="dealsBody"></tbody></table>
        </div>
      </section>
      <section class="card chart-card">
        <div class="card-head"><h2>Revenue</h2><select class="month-select" id="revenueMonth"></select></div>
        <canvas id="revenueChart" aria-label="Revenue chart"></canvas>
        <div class="chart-legend"><span><i class="legend-dot" style="background:#ff9a80"></i>Sales</span><span><i class="legend-dot" style="background:#d99cf9"></i>Profit</span></div>
      </section>
    </main>
  </div>
  <script src="../assets/js/config.js"></script><script src="../assets/js/icons.js"></script><script src="../assets/js/api.js"></script><script src="../assets/js/common.js"></script><script>SB.protect()</script><script src="../assets/js/layout.js"></script><script src="../assets/js/pages/dashboard.js"></script>
</body>
</html>
