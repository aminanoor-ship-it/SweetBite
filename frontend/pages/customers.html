<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customers | SweetBite</title><link rel="stylesheet" href="../assets/css/main.css"></head>
<body data-page="customers">
<div id="sidebar"></div><div class="app-shell"><div id="topbar"></div><main class="page-content">
  <div class="page-header"><h1 class="page-title">Customers</h1><button class="btn btn-primary" id="newCustomerBtn">+ customer</button></div>
  <div class="customer-toolbar"><select class="form-control customer-filter" id="customerSort"><option value="latest">last customer</option><option value="name">name A-Z</option></select></div>
  <section class="card customer-table-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>New Customer</th><th>Phone Number</th><th>Email</th><th>Location</th><th>Orders</th><th>Action</th></tr></thead><tbody id="customersBody"></tbody></table></div></section>
</main></div>
<div class="drawer-overlay" id="customerDrawer"><aside class="drawer"><button class="drawer-close" id="closeDrawer">×</button><h2 id="drawerTitle">New Customer</h2><p>Enter Customer information below</p><form class="drawer-form" id="customerForm" novalidate><input type="hidden" id="customerIdEdit">
<div class="form-group"><label>Customer Name</label><div class="input-icon"><span id="customerIcon"></span><input class="form-control" id="customerName" placeholder="Enter full name" required></div></div>
<div class="form-group"><label>Phone Number</label><div class="input-icon"><span id="phoneIcon"></span><input class="form-control" id="customerPhone" placeholder="Enter Phone Number" required></div></div>
<div class="form-group"><label>Email</label><div class="input-icon"><span id="emailIcon"></span><input class="form-control" id="customerEmail" type="email" placeholder="Enter Email address"></div></div>
<div class="form-group"><label>Location</label><div class="input-icon"><span id="locationIcon"></span><input class="form-control" id="customerLocation" placeholder="Enter Location" required></div></div>
<div class="form-group"><label>Address</label><input class="form-control" id="customerAddress" placeholder="Enter full address"></div>
<div class="drawer-actions"><button class="btn btn-light" type="button" id="cancelDrawer">Cancel</button><button class="btn btn-primary" type="submit">Save</button></div></form></aside></div>
<script src="../assets/js/config.js"></script><script src="../assets/js/icons.js"></script><script src="../assets/js/api.js"></script><script src="../assets/js/common.js"></script><script src="../assets/js/validation.js"></script><script>SB.protect()</script><script src="../assets/js/layout.js"></script><script src="../assets/js/pages/customers.js"></script>
</body></html>
