<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset Password | SweetBite</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body class="auth-page">
  <div class="auth-bg" aria-hidden="true"><span class="auth-blob one"></span><span class="auth-blob two"></span><span class="auth-blob three"></span><span class="auth-blob four"></span></div>
  <main class="auth-wrap">
    <section class="auth-card">
      <h1>Reset Password</h1>
      <p class="intro">Enter your new password below.</p>
      <form id="resetForm" class="auth-form" novalidate>
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <div class="password-field">
            <input class="form-control" id="newPassword" name="newPassword" type="password" placeholder="••••••••" required minlength="8">
            <button type="button" class="toggle-password" data-target="newPassword" aria-label="Toggle password visibility">
              <svg class="eye-icon eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-icon eye-closed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.06 3.29"/><line x1="1" y1="1" x2="23" y2="23"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/></svg>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm New Password</label>
          <div class="password-field">
            <input class="form-control" id="confirmPassword" name="confirmPassword" type="password" placeholder="••••••••" required minlength="8">
            <button type="button" class="toggle-password" data-target="confirmPassword" aria-label="Toggle password visibility">
              <svg class="eye-icon eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-icon eye-closed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.06 3.29"/><line x1="1" y1="1" x2="23" y2="23"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/></svg>
            </button>
          </div>
        </div>
        <div id="authError" class="auth-error"></div>
        <button class="btn btn-beige auth-submit" type="submit">Reset Password</button>
      </form>
      <p class="auth-footer">Remember your password? <a href="login.html">Back to Login</a></p>
    </section>
  </main>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/validation.js"></script>
  <script src="../assets/js/pages/auth.js"></script>
</body>
</html>
